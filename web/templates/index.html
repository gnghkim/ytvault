<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTVault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f0f0f; color: #e0e0e0; }

    header { background: #1a1a2e; padding: 16px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #2a2a4a; }
    header h1 { font-size: 1.4rem; color: #7c6af7; }
    header .subtitle { font-size: 0.85rem; color: #888; }

    .container { max-width: 1280px; margin: 0 auto; padding: 24px 16px; }

    .stats { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 12px 20px; min-width: 110px; text-align: center;
                 font: inherit; color: inherit; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .stat-card:hover { background: #22223e; border-color: #3a3a6a; }
    .stat-card:focus-visible { outline: 2px solid #7c6af7; outline-offset: 2px; }
    .stat-card.selected { border-color: #7c6af7; background: #25204a; box-shadow: 0 0 0 1px #7c6af7 inset; }
    .stat-card.selected .label { color: #c9bfff; }
    .stat-card .num { font-size: 1.8rem; font-weight: 700; }
    .stat-card .label { font-size: 0.75rem; color: #888; margin-top: 2px; }
    .stat-card.done .num { color: #4caf50; }
    .stat-card.downloading .num { color: #2196f3; }
    .stat-card.choice .num { color: #ff7043; }
    .stat-card.pending .num { color: #ff9800; }
    .stat-card.failed .num { color: #f44336; }
    .stat-card.total .num { color: #7c6af7; }

    .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #2a2a4a; }
    /* 열 너비를 고정하고 남는 폭은 제목 열이 쓴다. 제목 열이 너무 좁아질 화면에서만 가로 스크롤 */
    table { width: 100%; min-width: 1000px; table-layout: fixed; border-collapse: collapse; background: #1a1a2e; }
    .col-id { width: 52px; }
    .col-progress { width: 230px; }
    .col-res { width: 84px; }
    .col-drive { width: 74px; }
    .col-notion { width: 84px; }
    .col-error { width: 150px; }
    .col-created, .col-updated { width: 100px; }
    @media (max-width: 1200px) {
      /* 좁은 화면에서는 갱신 시각 열을 숨겨 제목 열 폭을 확보한다 */
      .col-updated { display: none; }
      table { min-width: 880px; }
    }
    thead th { background: #13132a; padding: 12px 14px; text-align: left; font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    tbody tr { border-top: 1px solid #2a2a4a; transition: background 0.15s; }
    tbody tr:hover { background: #20203a; }
    tbody tr.active { background: #161630; }
    td { padding: 10px 12px; font-size: 0.88rem; vertical-align: middle; overflow: hidden; }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
    .badge-pending         { background: #3a2e00; color: #ffc107; }
    .badge-awaiting_choice { background: #3a1a00; color: #ff7043; }
    .badge-downloading     { background: #002040; color: #42a5f5; }
    .badge-uploading       { background: #1a0040; color: #ab47bc; }
    .badge-notifying       { background: #002030; color: #26c6da; }
    .badge-done            { background: #003320; color: #66bb6a; }
    .badge-failed          { background: #3a0000; color: #ef5350; }

    .stage { margin-top: 6px; font-size: 0.8rem; color: #ccc; }
    .stage .step { color: #888; margin-right: 4px; }
    .bar { height: 6px; background: #2a2a4a; border-radius: 3px; margin-top: 5px; overflow: hidden; }
    .bar > div { height: 100%; background: linear-gradient(90deg, #7c6af7, #42a5f5); transition: width 0.6s; }
    .bar.indeterminate > div { width: 30% !important; animation: slide 1.2s infinite ease-in-out; }
    @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
    .detail { margin-top: 4px; font-size: 0.75rem; color: #888; }
    .choice-hint { margin-top: 6px; font-size: 0.78rem; color: #ffab91; }

    .title-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .title-cell a { color: #e0e0e0; text-decoration: none; }
    .title-cell a:hover { text-decoration: underline; }
    .res-cell { white-space: nowrap; color: #bbb; font-size: 0.82rem; }
    .link-btn         { display: inline-block; padding: 4px 10px; background: #7c6af7; color: #fff; border-radius: 6px; text-decoration: none; font-size: 0.78rem; }
    .link-btn:hover   { background: #9580ff; }
    .link-btn.notion  { background: #2e2e2e; border: 1px solid #555; }
    .link-btn.notion:hover { background: #444; }

    .retry-btn { margin-left: 6px; padding: 2px 9px; background: #2a2a4a; border: 1px solid #5a4a8a; color: #c9bfff; border-radius: 10px; cursor: pointer; font-size: 0.74rem; white-space: nowrap; }
    .retry-btn:hover:not(:disabled) { background: #3a3a6a; }
    .retry-btn:disabled { opacity: 0.5; cursor: default; }
    .error-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ef5350; font-size: 0.78rem; }
    .time-cell { white-space: nowrap; font-size: 0.78rem; color: #aaa; line-height: 1.35; }
    .time-cell .clock { color: #777; }
    .empty { text-align: center; padding: 48px; color: #555; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .search { display: flex; gap: 6px; align-items: center; flex: 1; min-width: 240px; max-width: 460px; }
    .search input { flex: 1; min-width: 0; padding: 7px 12px; background: #13132a; border: 1px solid #3a3a6a; border-radius: 6px; color: #e0e0e0; font-size: 0.88rem; }
    .search input:focus { outline: none; border-color: #7c6af7; }
    .result-info { font-size: 0.8rem; color: #888; white-space: nowrap; }
    .refresh-info { display: flex; align-items: center; gap: 10px; }
    .refresh-info span { font-size: 0.8rem; color: #666; }
    .refresh-btn { padding: 6px 14px; background: #2a2a4a; border: 1px solid #3a3a6a; color: #ccc; border-radius: 6px; cursor: pointer; font-size: 0.82rem; white-space: nowrap; }
    .refresh-btn:hover { background: #3a3a6a; }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 16px; flex-wrap: wrap; }
    .pagination button { min-width: 34px; padding: 6px 10px; background: #1a1a2e; border: 1px solid #2a2a4a; color: #ccc; border-radius: 6px; cursor: pointer; font-size: 0.82rem; }
    .pagination button:hover:not(:disabled) { background: #2a2a4a; }
    .pagination button.current { background: #7c6af7; border-color: #7c6af7; color: #fff; font-weight: 700; }
    .pagination button:disabled { opacity: 0.35; cursor: default; }
    .pagination .gap { color: #555; padding: 0 4px; }
    mark { background: #5a4a00; color: #ffe082; border-radius: 2px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>YTVault</h1>
      <div class="subtitle">YouTube → Google Drive + Notion 저장 현황</div>
    </div>
  </header>

  <div class="container">
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <form class="search" id="search-form" role="search">
        <input id="search-input" type="search" maxlength="100" autocomplete="off"
               placeholder="제목, URL, 작업 번호(#67)로 검색">
        <button class="refresh-btn" type="submit">검색</button>
      </form>
      <span class="result-info" id="result-info"></span>
      <div class="refresh-info">
        <span id="last-update">마지막 갱신: 방금</span>
        <button class="refresh-btn" type="button" onclick="loadJobs()">새로고침</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-id">#</th>
            <th class="col-title">제목</th>
            <th class="col-progress">진행 상태</th>
            <th class="col-res">해상도</th>
            <th class="col-drive">Drive</th>
            <th class="col-notion">Notion</th>
            <th class="col-error">오류</th>
            <th class="col-created">요청 시각</th>
            <th class="col-updated">갱신 시각</th>
          </tr>
        </thead>
        <tbody id="job-tbody"></tbody>
      </table>
    </div>
    <nav class="pagination" id="pagination" aria-label="페이지"></nav>
  </div>

  <script>
    // 진행 중인 작업의 세부 단계는 배지 아래 줄(STAGES)에 보여 준다
    const STATUS_LABELS = {
      pending: '대기', awaiting_choice: '해상도 선택', downloading: '진행 중',
      uploading: '진행 중', notifying: '진행 중', done: '완료', failed: '실패',
    };
    // 작업 1건이 거치는 세부 단계 (worker/downloader.py 의 STAGE_*)
    const STAGES = [
      ['probing', '영상 정보 확인'],
      ['downloading', '다운로드'],
      ['merging', '영상·음성 병합'],
      ['subtitles', '자막 받기'],
      ['summarizing', 'AI 요약'],
      ['uploading', 'Drive 업로드'],
      ['notion', 'Notion 기록'],
    ];
    const ACTIVE = ['pending', 'awaiting_choice', 'downloading', 'uploading', 'notifying'];
    const DEFAULT_RESOLUTION = '1080p';

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function safeUrl(url) {
      return /^https?:\/\//i.test(url || '') ? esc(url) : '#';
    }
    function resolutionLabel(height) {
      if (height === null || height === undefined) return '-';
      if (height === 0) return '최고 화질';
      return { 2160: '4K', 4320: '8K' }[height] || `${height}p`;
    }
    function fmtTime(value) {
      // "2026-10-11 00:14:18" → 날짜와 시각을 두 줄로 (열 폭을 줄이려고)
      const [date, time] = String(value ?? '').split(' ');
      return time ? `${esc(date)}<br><span class="clock">${esc(time)}</span>` : esc(value);
    }
    function minutesLeft(seconds) {
      return seconds >= 60 ? `${Math.ceil(seconds / 60)}분 남음` : `${seconds}초 남음`;
    }

    function renderProgress(j) {
      let html = `<span class="badge badge-${esc(j.status)}">${esc(STATUS_LABELS[j.status] || j.status)}</span>`;
      if (j.status === 'failed') {
        html += `<button type="button" class="retry-btn" data-retry="${esc(j.id)}" title="이 작업을 다시 대기열에 넣습니다">↻ 재시도</button>`;
        return html;
      }
      if (j.status === 'awaiting_choice') {
        const left = j.choice_remaining != null ? ` · ${minutesLeft(j.choice_remaining)}` : '';
        html += `<div class="choice-hint">텔레그램에서 해상도를 골라 주세요${left}<br>(고르지 않으면 ${DEFAULT_RESOLUTION})</div>`;
        return html;
      }
      if (!j.stage) {
        if (j.status === 'pending') html += '<div class="detail">순서를 기다리는 중</div>';
        return html;
      }
      const index = STAGES.findIndex(([key]) => key === j.stage);
      const label = index >= 0 ? STAGES[index][1] : j.stage;
      const step = index >= 0 ? `<span class="step">${index + 1}/${STAGES.length}</span>` : '';
      const hasPct = j.progress !== null && j.progress !== undefined;
      html += `<div class="stage">${step}${esc(label)}${hasPct ? ` ${Math.floor(j.progress)}%` : ''}</div>`;
      html += hasPct
        ? `<div class="bar"><div style="width:${Math.min(100, Math.max(0, j.progress))}%"></div></div>`
        : '<div class="bar indeterminate"><div></div></div>';
      if (j.stage_detail) html += `<div class="detail">${esc(j.stage_detail)}</div>`;
      return html;
    }

    function highlight(text, query) {
      // 검색어 부분을 <mark>로 감싼다. 조각마다 따로 이스케이프해서 HTML이 끼어들 수 없다
      if (!query) return esc(text);
      const lower = text.toLowerCase(), needle = query.toLowerCase();
      let html = '', from = 0, at;
      while ((at = lower.indexOf(needle, from)) !== -1) {
        html += esc(text.slice(from, at)) + `<mark>${esc(text.slice(at, at + needle.length))}</mark>`;
        from = at + needle.length;
      }
      return html + esc(text.slice(from));
    }

    // 통계 카드: [스타일, 필터 값(?status=, web/app.py STATUS_FILTERS), 포함 상태, 이름]
    const CARDS = [
      ['total', '', null, '전체'],
      ['done', 'done', ['done'], '완료'],
      ['downloading', 'active', ['downloading', 'uploading', 'notifying'], '진행 중'],
      ['choice', 'awaiting_choice', ['awaiting_choice'], '선택 대기'],
      ['pending', 'pending', ['pending'], '대기'],
      ['failed', 'failed', ['failed'], '실패'],
    ];
    const FILTER_LABELS = Object.fromEntries(CARDS.filter(c => c[1]).map(c => [c[1], c[3]]));

    function renderStats(counts, filter) {
      const all = Object.values(counts).reduce((a, b) => a + b, 0);
      document.getElementById('stats').innerHTML = CARDS.map(([cls, key, statuses, label]) => {
        const num = statuses ? statuses.reduce((n, s) => n + (counts[s] || 0), 0) : all;
        const selected = key === filter;
        return `<button type="button" class="stat-card ${cls}${selected ? ' selected' : ''}" data-filter="${key}"
                  aria-pressed="${selected}" title="${key ? `${label}만 보기` : '전체 보기'}">
                  <div class="num">${num}</div><div class="label">${label}</div></button>`;
      }).join('');
    }

    function pageNumbers(page, pages) {
      // 1 … 4 5 [6] 7 8 … 20 처럼 처음/끝과 현재 주변만 보여 준다
      const shown = new Set([1, pages]);
      for (let p = page - 2; p <= page + 2; p++) if (p >= 1 && p <= pages) shown.add(p);
      const list = [...shown].sort((a, b) => a - b);
      const result = [];
      list.forEach((p, i) => {
        if (i && p - list[i - 1] > 1) result.push(null);
        result.push(p);
      });
      return result;
    }

    function renderPagination(data) {
      const nav = document.getElementById('pagination');
      if (data.pages <= 1) { nav.innerHTML = ''; return; }
      const button = (label, target, extra = '') =>
        `<button type="button" data-page="${target}" ${extra}>${label}</button>`;
      nav.innerHTML =
        button('‹ 이전', data.page - 1, data.page === 1 ? 'disabled' : '') +
        pageNumbers(data.page, data.pages).map(p => p === null
          ? '<span class="gap">…</span>'
          : button(p, p, p === data.page ? 'class="current" aria-current="page"' : '')).join('') +
        button('다음 ›', data.page + 1, data.page === data.pages ? 'disabled' : '');
    }

    function render(data) {
      renderStats(data.counts, data.status);
      renderPagination(data);
      const from = data.total ? (data.page - 1) * data.size + 1 : 0;
      const to = Math.min(data.page * data.size, data.total);
      const filterLabel = FILTER_LABELS[data.status];
      let info = data.query ? `"${data.query}" 검색 결과` : '';
      if (filterLabel) info = info ? `${info} 중 ${filterLabel}` : filterLabel;
      document.getElementById('result-info').textContent =
        `${info || '전체'} ${data.total}건` + (data.total ? ` · ${from}–${to}` : '');

      const tbody = document.getElementById('job-tbody');
      if (!data.items.length) {
        const message = data.query ? '검색 결과가 없습니다.'
          : filterLabel ? `${filterLabel} 상태인 작업이 없습니다.`
          : '아직 작업이 없습니다. Telegram으로 YouTube 링크를 보내보세요.';
        tbody.innerHTML = `<tr><td colspan="9" class="empty">${message}</td></tr>`;
        return;
      }
      tbody.innerHTML = data.items.map(j => `
        <tr class="${ACTIVE.includes(j.status) ? 'active' : ''}">
          <td>${esc(j.id)}</td>
          <td class="title-cell" title="${esc(j.title || j.url)}"><a href="${safeUrl(j.url)}" target="_blank" rel="noopener">${highlight(j.title || j.url || '', data.query)}</a></td>
          <td class="progress-cell">${renderProgress(j)}</td>
          <td class="res-cell">${esc(resolutionLabel(j.max_height))}</td>
          <td>${j.gdrive_link ? `<a class="link-btn" href="${safeUrl(j.gdrive_link)}" target="_blank" rel="noopener">Drive</a>` : '-'}</td>
          <td>${j.notion_url ? `<a class="link-btn notion" href="${safeUrl(j.notion_url)}" target="_blank" rel="noopener">Notion</a>` : '-'}</td>
          <td class="error-cell" title="${esc(j.error_msg)}">${esc(j.error_msg)}</td>
          <td class="time-cell">${fmtTime(j.created_fmt)}</td>
          <td class="time-cell col-updated">${fmtTime(j.updated_fmt)}</td>
        </tr>
      `).join('');
    }

    // 현재 보고 있는 페이지, 검색어, 상태 필터. 주소창(?page=&q=&status=)에도 남겨 새로고침해도 유지된다
    const state = { page: 1, q: '', filter: '' };
    let timer = null;
    let requestSeq = 0;

    function schedule(counts) {
      // 진행 중인 작업이 있으면 3초, 없으면 30초마다 갱신 (검색·페이지와 무관하게 전체 기준)
      const busy = ACTIVE.some(s => counts[s]);
      clearTimeout(timer);
      timer = setTimeout(loadJobs, busy ? 3000 : 30000);
      return busy;
    }

    function syncUrl() {
      const params = new URLSearchParams();
      if (state.page > 1) params.set('page', state.page);
      if (state.q) params.set('q', state.q);
      if (state.filter) params.set('status', state.filter);
      const query = params.toString();
      history.replaceState(null, '', query ? `?${query}` : location.pathname);
    }

    function apply(data) {
      state.page = data.page;  // 서버가 범위를 벗어난 페이지 번호를 맞춰 준 값
      state.filter = data.status || '';  // 알 수 없는 필터는 서버가 ''(전체)로 돌려준다
      render(data);
      syncUrl();
      return schedule(data.counts);
    }

    async function loadJobs() {
      const seq = ++requestSeq;
      try {
        const params = new URLSearchParams({ page: state.page, q: state.q, status: state.filter });
        const res = await fetch(`/api/jobs?${params}`);
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        if (seq !== requestSeq) return;  // 그사이 더 새로운 요청을 보냈으면 이 응답은 버린다
        const busy = apply(data);
        document.getElementById('last-update').textContent =
          `마지막 갱신: ${new Date().toLocaleTimeString('ko-KR')} · ${busy ? '3초' : '30초'}마다 자동 갱신`;
      } catch (e) {
        if (seq !== requestSeq) return;
        document.getElementById('last-update').textContent = '갱신 실패 — 잠시 후 다시 시도합니다';
        clearTimeout(timer);
        timer = setTimeout(loadJobs, 10000);
      }
    }

    function search(query) {
      state.q = query.trim();
      state.page = 1;
      loadJobs();
    }

    const searchInput = document.getElementById('search-input');
    let debounce = null;
    document.getElementById('search-form').addEventListener('submit', e => {
      e.preventDefault();
      clearTimeout(debounce);
      search(searchInput.value);
    });
    searchInput.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => search(searchInput.value), 400);
    });
    document.getElementById('stats').addEventListener('click', e => {
      // 카드를 누르면 그 상태만, 이미 선택된 카드나 '전체'를 누르면 필터를 푼다. 검색어는 유지
      const card = e.target.closest('[data-filter]');
      if (!card) return;
      const key = card.dataset.filter;
      state.filter = key === state.filter ? '' : key;
      state.page = 1;
      loadJobs();
    });
    document.getElementById('job-tbody').addEventListener('click', async e => {
      const target = e.target.closest('button[data-retry]');
      if (!target || target.disabled) return;
      target.disabled = true;
      target.textContent = '요청 중…';
      try {
        const res = await fetch(`/api/jobs/${target.dataset.retry}/retry`, {
          method: 'POST', headers: { 'X-YTVault-Request': '1' },
        });
        if (!res.ok && res.status !== 409) throw new Error((await res.json()).detail || res.status);
        // 409 = 그사이 이미 재시도됨. 어느 쪽이든 목록을 다시 불러와 현재 상태를 보여 준다
      } catch (err) {
        alert(`재시도 요청 실패: ${err.message}`);
      }
      loadJobs();
    });
    document.getElementById('pagination').addEventListener('click', e => {
      const target = e.target.closest('button[data-page]');
      if (!target || target.disabled) return;
      state.page = Number(target.dataset.page);
      loadJobs();
      document.querySelector('.table-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    const initial = {{ initial | tojson }};
    state.q = initial.query;
    state.filter = initial.status || '';
    searchInput.value = initial.query;
    apply(initial);
  </script>
</body>
</html>
